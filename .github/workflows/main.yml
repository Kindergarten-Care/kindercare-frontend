name: CI/CD KinderCareFrontEnd NextJS

on:
  push:
    branches: [ "release/master", "dev" ] # Chạy khi push vào master hoặc dev

permissions:
  packages: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          # Chuyển tên repo về chữ thường và sanitize branch name (thay / bằng -)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          CLEAN_REF=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          
          docker build -t ghcr.io/$REPO_LOWER:$CLEAN_REF .
          docker push ghcr.io/$REPO_LOWER:$CLEAN_REF

      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            CLEAN_REF=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            
            IMAGE=ghcr.io/$REPO_LOWER:$CLEAN_REF
            CONTAINER=kindercare-$CLEAN_REF
            
            # Nếu là release/master thì dùng cổng 3000, ngược lại (dev) dùng 3002
            if [[ "${{ github.ref_name }}" == *"master"* ]]; then 
              PORT=3000
            else 
              PORT=3002
            fi

            # Đăng nhập vào Registry trên VPS
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull $IMAGE
            docker stop $CONTAINER || true
            docker rm $CONTAINER || true
            docker run -d --name $CONTAINER -p $PORT:3000 $IMAGE