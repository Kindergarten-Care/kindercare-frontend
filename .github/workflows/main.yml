name: CI/CD KinderCare Monorepo

on:
  push:
    branches: [ "release/master", "dev" ]

permissions:
  contents: read
  packages: write
  actions: write

env:
  IMAGE_TAG: ${{ github.ref_name == 'release/master' && 'release-master' || 'dev' }}
  CACHE_VERSION: v2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [parent, teacher, principal, landing, portal]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "IMAGE_REPOSITORY=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_NAME=${{ matrix.app }}
            NEXT_PUBLIC_API_URL=${{ github.ref_name == 'release/master' && 'https://web.kindercare.app/api/v1' || 'https://web-test.kindercare.app/api/v1' }}
            NEXT_PUBLIC_API_BASE=/api
            NEXT_PUBLIC_LANDING_APP_URL=${{ github.ref_name == 'release/master' && 'https://kindercare.app' || 'https://web-test.kindercare.app' }}
            NEXT_PUBLIC_PARENT_APP_URL=${{ github.ref_name == 'release/master' && 'https://parent.kindercare.app' || 'https://parent-test.kindercare.app' }}
            NEXT_PUBLIC_TEACHER_APP_URL=${{ github.ref_name == 'release/master' && 'https://teacher.kindercare.app' || 'https://teacher-test.kindercare.app' }}
            NEXT_PUBLIC_PRINCIPAL_APP_URL=${{ github.ref_name == 'release/master' && 'https://principal.kindercare.app' || 'https://principal-test.kindercare.app' }}
            NEXT_PUBLIC_PORTAL_APP_URL=${{ github.ref_name == 'release/master' && 'https://portal.kindercare.app' || 'https://portal-test.kindercare.app' }}
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/${{ matrix.app }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ env.CACHE_VERSION }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ env.CACHE_VERSION }}

  deploy:
    name: deploy (${{ matrix.app }})
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: landing
            port: 3000
          - app: teacher
            port: 3001
          - app: principal
            port: 3002
          - app: parent
            port: 3004
          - app: portal
            port: 3005
    steps:
      - name: Set lower case owner name
        run: |
          echo "IMAGE_REPOSITORY=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Phân biệt môi trường
            ENV_SUFFIX="${{ github.ref_name == 'release/master' && 'prod' || 'dev' }}"
            BASE_PORT=${{ matrix.port }}
            if [ "$ENV_SUFFIX" == "dev" ]; then
              DEPLOY_PORT=$((BASE_PORT + 1000))
            else
              DEPLOY_PORT=$BASE_PORT
            fi
            
            IMAGE_NAME="ghcr.io/${{ env.IMAGE_REPOSITORY }}/${{ matrix.app }}:${{ env.IMAGE_TAG }}"
            CONTAINER_NAME="kindercare-${{ matrix.app }}-$ENV_SUFFIX"
            
            echo "Deploying $IMAGE_NAME to $CONTAINER_NAME on port $DEPLOY_PORT"
            
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            
            docker pull $IMAGE_NAME
            
            docker run -d \
              --name $CONTAINER_NAME \
              -p $DEPLOY_PORT:3000 \
              --restart always \
              $IMAGE_NAME

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: SSH Cleanup VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Cleaning up old images..."
            docker image prune -af --filter "until=24h"