name: CI/CD KinderCare Monorepo

on:
  push:
    branches: [ "release/master", "dev" ]

permissions:
  packages: write
  contents: read

env:
  IMAGE_TAG: ${{ github.ref_name == 'release/master' && 'release-master' || 'dev' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [parent, teacher, principal, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "IMAGE_REPOSITORY=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_NAME=${{ matrix.app }}
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/${{ matrix.app }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: parent
            port: 3000
          - app: teacher
            port: 3001
          - app: principal
            port: 3002
          - app: admin
            port: 3003
    steps:
      - name: Set lower case owner name
        run: |
          echo "IMAGE_REPOSITORY=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            IMAGE_NAME="ghcr.io/${{ env.IMAGE_REPOSITORY }}/${{ matrix.app }}:${{ env.IMAGE_TAG }}"
            CONTAINER_NAME="kindercare-${{ matrix.app }}-prod"
            
            echo "Deploying $IMAGE_NAME to $CONTAINER_NAME on port ${{ matrix.port }}"
            
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            
            # Pull image mới nhất
            docker pull $IMAGE_NAME
            
            # Chạy container mới
            docker run -d \
              --name $CONTAINER_NAME \
              -p ${{ matrix.port }}:${{ matrix.port }} \
              --restart always \
              $IMAGE_NAME
            
            # Dọn dẹp image rác để tránh đầy ổ cứng VPS
            docker image prune -f