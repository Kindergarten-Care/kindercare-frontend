name: CI/CD KinderCare Monorepo

on:
  push:
    branches: [ "release/master", "dev" ]

permissions:
  packages: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [parent, teacher, principal, admin]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          CLEAN_REF=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          IMAGE_NAME="ghcr.io/$REPO_LOWER/${{ matrix.app }}:$CLEAN_REF"
          
          docker build \
            --build-arg APP_NAME=${{ matrix.app }} \
            -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            CLEAN_REF=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            IMAGE="ghcr.io/$REPO_LOWER/${{ matrix.app }}:$CLEAN_REF"
            
            # Quy hoạch Port cho Monorepo
            # Parent: 3000 (Prod) / 3100 (Test)
            # Teacher: 3001 (Prod) / 3101 (Test)
            # Principal: 3002 (Prod) / 3102 (Test)
            # Admin: 3003 (Prod) / 3103 (Test)
            
            BASE_PORT=3000
            if [[ "${{ matrix.app }}" == "teacher" ]]; then BASE_PORT=3001; fi
            if [[ "${{ matrix.app }}" == "principal" ]]; then BASE_PORT=3002; fi
            if [[ "${{ matrix.app }}" == "admin" ]]; then BASE_PORT=3003; fi
            
            if [[ "${{ github.ref_name }}" == *"master"* ]]; then 
              PORT=$BASE_PORT
              CONTAINER="kindercare-${{ matrix.app }}-prod"
            else 
              PORT=$((BASE_PORT + 100))
              CONTAINER="kindercare-${{ matrix.app }}-test"
            fi

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker image prune -af
            docker pull $IMAGE
            docker stop $CONTAINER || true
            docker rm $CONTAINER || true
            docker run -d \
              --name $CONTAINER \
              -p $PORT:3000 \
              --restart always \
              $IMAGE